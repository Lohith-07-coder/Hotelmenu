<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine? 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      overflow: hidden;
      color: white;
    }

    /* Floating hearts background */
    .hearts span {
      position: absolute;
      bottom: -50px;
      font-size: 20px;
      animation: float 10s linear infinite;
      opacity: 0.6;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 40px 25px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      z-index: 2;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 25px;
      font-weight: 700;
    }

    .question {
      font-size: 20px;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 20px;
      position: relative;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: white;
      box-shadow: 0 5px 15px rgba(255,75,43,0.4);
    }

    #yesBtn:hover {
      transform: scale(1.1);
    }

    #noBtn {
      background: white;
      color: #ff416c;
      position: relative;
    }

    .result {
      margin-top: 25px;
      font-size: 22px;
      font-weight: 600;
      display: none;
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Floating hearts -->
  <div class="hearts">
    <span style="left:10%; animation-delay:0s">❤️</span>
    <span style="left:25%; animation-delay:2s">💖</span>
    <span style="left:40%; animation-delay:4s">💕</span>
    <span style="left:55%; animation-delay:1s">💘</span>
    <span style="left:70%; animation-delay:3s">❤️</span>
    <span style="left:85%; animation-delay:5s">💗</span>
  </div>

  <div class="container">
    <h1>💘 Special Question 💘</h1>

    <div class="question">
      Will you be my Valentine? 💖🥺
    </div>

    <div class="buttons">
      <button id="yesBtn">Yes 😍</button>
      <button id="noBtn">No 🙈</button>
    </div>

    <div class="result" id="result">
      Yayyy! 💕 I knew it! 😘❤️<br>
      You are my Valentine forever 💍💖
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const result = document.getElementById('result');

    // Move NO button when user tries to click
    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 150 - 75;

      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    // YES button action
    yesBtn.addEventListener('click', () => {
      document.querySelector('.buttons').style.display = 'none';
      result.style.display = 'block';
    });
  </script>

</body>
</html>
